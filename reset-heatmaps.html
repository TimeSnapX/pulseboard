<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset heatmaps · PulseBoard</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0b0f14; color:#e8eef6; min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; }
    .card { max-width:440px; background:#151b24; border:1px solid #2a3444; border-radius:16px; padding:24px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { color:#8b9bb4; line-height:1.45; }
    button { display:block; width:100%; margin-top:18px; padding:14px 16px; border-radius:12px; border:0; background:#f7931a; color:#111; font-weight:700; cursor:pointer; font-size:1rem; }
    .ok { color:#5dcaa5; margin-top:14px; display:none; }
    .err { color:#e06c75; margin-top:14px; display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset habit heatmaps</h1>
    <p>Clears all past heatmap checkmarks in this browser. Keeps your habit list. Starts clean from <b id="today"></b>.</p>
    <button type="button" id="go">Reset heatmaps from today</button>
    <p class="ok" id="ok">Done. Opening PulseBoard…</p>
    <p class="err" id="err"></p>
  </div>
  <script>
    const KEY = "pulseboard-v1";
    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
    const t = todayISO();
    document.getElementById("today").textContent = t;
    document.getElementById("go").addEventListener("click", () => {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) {
          document.getElementById("err").style.display = "block";
          document.getElementById("err").textContent = "No PulseBoard data in this browser yet. Open PulseBoard once first, then come back here.";
          return;
        }
        const state = JSON.parse(raw);
        const logs = state.habitLogs || {};
        let cleared = 0;
        for (const id of Object.keys(logs)) {
          const map = logs[id] || {};
          const next = {};
          for (const date of Object.keys(map)) {
            if (date >= t) next[date] = map[date];
            else cleared += 1;
          }
          logs[id] = next;
        }
        state.habitLogs = logs;
        localStorage.setItem(KEY, JSON.stringify(state));
        document.getElementById("ok").style.display = "block";
        document.getElementById("ok").textContent = "Cleared " + cleared + " past checkmarks. Opening Habits…";
        setTimeout(() => { location.href = "./#habits"; }, 700);
      } catch (e) {
        document.getElementById("err").style.display = "block";
        document.getElementById("err").textContent = String(e.message || e);
      }
    });
  </script>
</body>
</html>
