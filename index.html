<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseBoard · personal dashboard</title>
    <meta
      name="description"
      content="Dark personal dashboard for habits, goals, money, IG trading prep, intake, and karate. Stored only in this browser."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M4.5 18h4.2l2.6-7.5 3.4 13 3.2-9.2 2.1 3.7H27.5"
                stroke="#1a0f04"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <h1>PulseBoard</h1>
            <p>Local · AUD · this browser only</p>
          </div>
        </div>
        <div class="today-date" id="today-date"></div>
      </header>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <button type="button" data-act="app.tab" data-tab="habits" class="active">Habits</button>
        <button type="button" data-act="app.tab" data-tab="goals">Goals</button>
        <button type="button" data-act="app.tab" data-tab="money">Money</button>
        <button type="button" data-act="app.tab" data-tab="trading">Trading</button>
        <button type="button" data-act="app.tab" data-tab="intake">Intake</button>
        <button type="button" data-act="app.tab" data-tab="karate">Karate</button>
      </nav>

      <div class="summary" id="summary"></div>
      <main id="main" class="view"></main>

      <footer class="footer">
        <span>PulseBoard · nothing leaves this device</span>
        <span>
          <button type="button" class="btn tiny ghost" data-act="app.reset">Reset demo data</button>
        </span>
      </footer>
    </div>
    <dialog id="modal"></dialog>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
